name: Apple tree matching and validation optimization
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: config/requirements.txt
      - run: python -m pip install -r config/requirements.txt
      - name: Execute core and optimization notebook with synthetic data
        run: python tools/run_notebook.py --notebook apple_tree_matching_opt_attempt.ipynb --synthetic --skip-resnet --output outputs/synthetic_core_executed.ipynb
      - run: python -m pip install -r config/requirements-resnet.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python tools/download_resnet_weights.py
      - run: python -m pytest -q
      - run: python tools/run_notebook.py --synthetic
      - uses: actions/upload-artifact@v6
        if: ${{ always() && hashFiles('outputs/synthetic*executed.ipynb') != '' }}
        with:
          name: synthetic-notebook
          path: outputs/synthetic*executed.ipynb
          if-no-files-found: error
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r config/requirements-docs.txt
      - run: python tools/build_docs.py
      - uses: actions/upload-artifact@v6
        with:
          name: html-documentation
          path: doc/_build/html/
          if-no-files-found: error
