name: Data preparation checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: config/requirements.txt
      - run: python -m pip install -r config/requirements.txt
      - run: python -m pytest -q
      - run: python tools/run_notebook.py --synthetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-notebook
          path: outputs/synthetic_executed.ipynb
